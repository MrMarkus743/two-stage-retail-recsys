[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (синтаксис, неиспользуемые переменные и импорты)
    "I",      # isort (автоматическая сортировка импортов)
    "B",      # flake8-bugbear (типовые баги Python)
    "UP",     # pyupgrade (модернизация синтаксиса до Python 3.13)
]
ignore = [
    "E501",   # Игнорировать длину строки (Ruff format форматирует переносы сам)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"