name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-checks:
    name: Lint, Test & Repo-Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Repo-Guard
        run: |
          echo "==> Checking for files larger than 1MB outside whitelist..."
          LARGE_FILES=$(find . -type f -not -path './.git/*' -not -path './data/sample/*' -size +1048576c)
          if [ -n "$LARGE_FILES" ]; then
            echo "::error::Files exceeding 1MB limit detected outside data/sample/:"
            echo "$LARGE_FILES"
            exit 1
          fi

          echo "==> Checking for raw/binary data formats outside whitelist..."
          BLOCKED_FILES=$(find . -type f -not -path './.git/*' -not -path './data/sample/*' \( -name "*.csv" -o -name "*.parquet" -o -name "*.npz" -o -name "*.tar.gz" -o -name "*.zip" \))
          if [ -n "$BLOCKED_FILES" ]; then
            echo "::error::Blocked data artifacts detected outside data/sample/:"
            echo "$BLOCKED_FILES"
            exit 1
          fi

          echo "Repo-Guard checks passed successfully."

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and check imports (Ruff)
        run: ruff check .

      - name: Check code formatting (Ruff)
        run: ruff format --check .

      - name: Run unit & smoke tests (Pytest)
        run: pytest tests/
